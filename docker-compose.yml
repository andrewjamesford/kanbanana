services:
  mongodb:
    image: mongo:9.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status() } catch (error) { rs.initiate({_id:"rs0", members:[{_id:0,host:"mongodb:27017"}]}) }; if (!db.hello().isWritablePrimary) quit(1)'
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4100
      MONGODB_URI: mongodb://mongodb:27017/kanbanana?replicaSet=rs0
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:4100
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:
  api_node_modules:
  web_node_modules:
